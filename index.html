<h1 id="introduction">Introduction</h1>
<ul>
<li>State is a data store for our components
<ul>
<li>It can be used make decisions on how the UI is rendered</li>
<li>It can be used display interactive content in our UI</li>
</ul>
</li>
<li>Components have lifecycles
<ul>
<li>These are mounting, updating and unmounting</li>
</ul>
</li>
<li>Components have ways for us to perform operations at certain stages of this lifecycle
<ul>
<li>In functional components we can use hooks</li>
<li>In class based components we have lifecycle methods</li>
</ul>
</li>
</ul>
<footer>Created with <a href="https://marp.app">Marp</a> and <a href="https://pages.github.com">Github Pages</a></footer>

<h1 id="the-react-168-caveat">The React 16.8 caveat</h1>
<ul>
<li>Pre React 16.8, functional components cannot easily hook into the lifecycle</li>
<li>Instead we have to use class components</li>
<li>Post React 16.8 we can use something called &quot;hooks&quot; to hook into the lifecycle</li>
<li>Hooks are not analagous to class based lifecycle methods but can be used to perform similar operations</li>
</ul>

<h1 id="component-lifecycle">Component Lifecycle</h1>
<ul>
<li>React components have a lifecycle with 3 phases:</li>
<li>Mounting - triggered on creation of component and insertion into the DOM</li>
<li>Updating - triggered when a component's props or state change</li>
<li>Unmounting - triggered before the component is removed from the DOM</li>
</ul>

<h1 id="what-is-a-reducer">What is a reducer</h1>
<ul>
<li>A reducer is a function which returns a new, modified state</li>
<li>It takes the original state as an argument</li>
<li>It takes an action which tells us how to modify the state</li>
<li>Actions are objects</li>
<li>Actions contain a type (the name of the action)</li>
<li>Actions contain data about the change we want to make</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title function_">userReducer</span> (<span class="hljs-params">state = {}, action</span>) {
  <span class="hljs-keyword">switch</span> (action.<span class="hljs-property">type</span>) {
    <span class="hljs-keyword">case</span> <span class="hljs-string">&#x27;update_user&#x27;</span>:
      <span class="hljs-keyword">return</span> <span class="hljs-title class_">Object</span>.<span class="hljs-title function_">assign</span>({}, state, action.<span class="hljs-property">payload</span>);
    <span class="hljs-attr">default</span>:
      <span class="hljs-keyword">return</span> state;
  }
}
</code></pre>

<h1 id="modifying-complex-state-changes-in-functional-components-using-usereducer">Modifying complex state changes in functional components using <code>useReducer</code></h1>
<div class="columns">
<ul>
<li>Modern React has a hook for modifying state in a reducer</li>
<li>It's less complex than redux</li>
<li><code>useReducer</code> is an abstraction of <code>useState</code></li>
<li><code>useReducer</code> takes a reducer function</li>
<li><code>useReducer</code> takes the initial state</li>
<li><code>useReducer</code> returns the state and a function <code>dispatch</code></li>
<li><code>dispatch</code> functions &quot;dispatch&quot; an action to our reducer</li>
<li>state lives at the component level</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-jsx"><span class="hljs-keyword">function</span> <span class="hljs-title function_">UserComponent</span> (<span class="hljs-params">props</span>) {
  <span class="hljs-keyword">const</span> [user, dispatch] = <span class="hljs-title class_">React</span>.<span class="hljs-title function_">useReducer</span>(userReducer, {});

  <span class="hljs-keyword">function</span> <span class="hljs-title function_">setUser</span> (<span class="hljs-params">userData</span>) {
    <span class="hljs-title function_">dispatch</span>({ <span class="hljs-attr">type</span>: <span class="hljs-string">&#x27;update_user&#x27;</span>, <span class="hljs-attr">payload</span>: userData });
  }

  <span class="hljs-keyword">function</span> <span class="hljs-title function_">handleUpdate</span> (<span class="hljs-params">userData</span>) {

<h1 id="custom-hooks">Custom hooks</h1>
<div class="columns">
<ul>
<li>Lots of hooks to perform common tasks can make our components big and hard to read</li>
<li>Imagine if every page required setting up state, fetching data from an API, updating the data etc</li>
<li>What if we could do it all in one neat package</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-jsx"><span class="hljs-keyword">function</span> <span class="hljs-title function_">useRestfulApi</span> (<span class="hljs-params">resourceName, resourceId, initialState</span>) {
  <span class="hljs-keyword">const</span> [resource, setResource] = <span class="hljs-title class_">React</span>.<span class="hljs-title function_">useState</span>(initialState);
  <span class="hljs-keyword">const</span> url = <span class="hljs-string">`https://example.com/<span class="hljs-subst">${resourceName}</span>/<span class="hljs-subst">${resourceId}</span>`</span>

  <span class="hljs-title class_">React</span>.<span class="hljs-title function_">useEffect</span>(<span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) {
    <span class="hljs-keyword">const</span> controller = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AbortController</span>();

    <span class="hljs-title function_">fetch</span>(url, {
      <span class="hljs-attr">method</span>: <span class="hljs-string">&#x27;GET&#x27;</span>
    }).<span class="hljs-title function_">then</span>(<span class="hljs-keyword">function</span> (<span class="hljs-params">response</span>) {
      <span class="hljs-keyword">return</span> response.<span class="hljs-title function_">json</span>();
    }).<span class="hljs-title function_">then</span>(setResource);

    <span class="hljs-keyword">return</span> controller.<span class="hljs-title function_">abort</span>();
